language: "ko-KR"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*.kt"
      instructions: |
        아래 Azit Batch 프로젝트 규칙에 따라 리뷰해주세요.

        ## Kotlin 코드 스타일
        - `!!` (non-null assertion) 사용은 반드시 지적합니다. `requireNotNull()` 또는 `?: throw`로 대체를 제안합니다.
        - JPA 엔티티에 `data class`를 사용하면 지적합니다 (프록시 문제). 일반 `class`로 선언해야 합니다.
        - 단일 표현식으로 작성 가능한 함수가 `return` 블록으로 작성되어 있으면 표현식 함수(`=`) 사용을 제안합니다.
        - `javax.*` 패키지 사용은 반드시 `jakarta.*`로 교체를 요청합니다.
        - `req`, `res`, `svc`, `cnt`, `proc` 등 모호한 줄임말 사용 시 풀네임으로 교체를 요청합니다.

        ## Spring Batch 아키텍처
        - `ItemProcessor`에 DB 쓰기, 외부 API 호출 등 부수 효과가 포함되어 있으면 반드시 지적합니다. Processor는 변환 로직만 담당해야 합니다.
        - `ItemProcessor`에서 의도 없이 `null`을 반환하는 경우 지적합니다. 의도적 제외라면 이유가 명확해야 합니다.
        - Job/Step 청크 사이즈가 하드코딩되어 있으면 `companion object` 상수로 분리를 제안합니다.
        - `baseDate` 등 실행 기준값이 하드코딩되어 있으면 JobParameter로 주입받도록 제안합니다.

        ## External / Feign
        - Feign 클라이언트(`@FeignClient`)가 Job/Processor에 직접 주입되어 있으면 반드시 지적합니다. `SocialAuthPort` 인터페이스를 통해 접근해야 합니다.
        - `SocialAuthPort` 없이 Provider 분기(`if/when (provider == KAKAO)`)가 잡 로직에 포함되어 있으면 `SocialAuthPortRouter` 패턴 사용을 제안합니다.
        - Feign 호출에 예외 처리가 없으면 `faultTolerant().skip(FeignException::class.java)` 구성을 제안합니다.

        ## 명명 규칙
        - Job 이름은 `{도메인}{목적}Job` 형식인지 확인합니다.
        - Step 이름은 `{도메인}{목적}Step` 형식인지 확인합니다.
        - 외부 API DTO는 `{Provider}{목적}Request` / `{Provider}{목적}Response` 형식인지 확인합니다.

    - path: "src/**/job/**/*JobConfig.kt"
      instructions: |
        JobConfig 파일 전용 리뷰 규칙입니다.
        - Job과 Step 빈 등록 외의 비즈니스 로직이 포함되어 있으면 지적합니다.
        - `JOB_NAME`, `CHUNK_SIZE` 등 상수가 `companion object`로 분리되어 있는지 확인합니다.
        - `@StepScope`가 필요한 빈에 빠져 있지 않은지 확인합니다.

    - path: "src/**/external/**/*.kt"
      instructions: |
        External 패키지 리뷰 규칙입니다.
        - `SocialAuthPort`를 구현하는 어댑터가 `supports()` 메서드를 올바르게 구현했는지 확인합니다.
        - Feign 클라이언트 응답 DTO가 `external/dto` 패키지에 위치하는지 확인합니다.
        - 어댑터 내부에 비즈니스 로직이 포함되어 있으면 지적합니다.

    - path: "src/test/**/*.kt"
      instructions: |
        테스트 코드 리뷰 규칙입니다.
        - 테스트 메서드명이 `메서드명_상황_기대결과` 구조인지 확인합니다.
        - `ItemProcessor` 로직에 단위 테스트가 있는지 확인합니다.
        - 외부 의존성(DB, Feign)이 Mock 없이 테스트에 포함되어 있으면 지적합니다.

    - path: "**/*.yml"
      instructions: |
        - 민감 정보(비밀번호, API 키, 토큰)가 하드코딩되어 있으면 반드시 지적합니다.
        - `spring.batch.job.name` 설정이 로컬 환경(`application-local.yml`)에서만 사용되는지 확인합니다.

chat:
  auto_reply: true
