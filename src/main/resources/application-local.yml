spring:
  config:
    activate:
      on-profile: local

  batch:
    jdbc:
      initialize-schema: always # 로컬은 배치 메타데이터 테이블 자동 생성
    # 로컬 단일 잡 수동 실행 예시:
    # ./gradlew bootRun --args="--spring.batch.job.name=memberPurgeJob baseDate=2026-07-09"
    # job:
    #   name: memberPurgeJob

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password:

  cloud:
    aws:
      s3:
        bucket: dev-azit-storage
      cloudfront:
        domain: https://dev-images.azitcrew.com
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
      region:
        static: ap-northeast-2

kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    admin-key: ${KAKAO_ADMIN_KEY}
    redirect-url: http://localhost:5173/auth/kakao/callback

apple:
  oauth:
    team-id: ${APPLE_TEAM_ID}
    client-id: ${APPLE_SERVICE_ID}
    key-id: ${APPLE_KEY_ID}
    key-path: ${APPLE_KEY_PATH}
    redirect-url:
    success-redirect-url: https://dev.azitcrew.com/login-success

naver:
  search:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-seconds:
  refresh-token-expiration-seconds:
  refresh-token-name: azit_rt_local
  cookie:
    secure: false
    same-site: None

payment:
  bank:
    name: ${PAYMENT_BANK_NAME}
    account-number: ${PAYMENT_BANK_ACCOUNT_NUMBER}
    account-holder: ${PAYMENT_BANK_ACCOUNT_HOLDER}

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
