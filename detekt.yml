build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

# 코드 복잡도
complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated:
      - "Entity"  # JPA 엔티티는 테이블 컬럼 수만큼 생성자 파라미터가 필요
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15

# 잠재적 버그
potential-bugs:
  active: true
  # !! 사용 금지 (requireNotNull() 또는 ?: throw 사용)
  UnsafeCallOnNullableType:
    active: true
  NullableToStringCall:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true

# 코드 스타일
style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ["-1", "0", "1", "2", "100"]
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  # 불필요한 코드 제거
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  # return 생략 가능한 경우 표현식 함수 권장
  UseCheckOrError:
    active: true
  # 와일드카드 import 금지
  WildcardImport:
    active: true
    excludeImports:
      - "kotlinx.coroutines.*"

# 빈 블록 금지
empty-blocks:
  active: true
  EmptyDefaultConstructor:
    active: true

# 명명 규칙
naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - "Test"
      - "ParameterizedTest"
      - "Bean"
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
  # 상수 명명 (companion object / top-level 상수)
  ObjectPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
  # 약어 지양: req, res, svc 등
  VariableMinLength:
    active: true
    minimumVariableNameLength: 2

# 예외 처리
exceptions:
  active: true
  # 빈 catch 블록 금지
  SwallowedException:
    active: true
  # Exception 직접 throw 금지
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - "Exception"
      - "RuntimeException"
      - "Throwable"
      - "Error"

# 성능
performance:
  active: true
  ArrayPrimitive:
    active: true
  SpreadOperator:
    active: false  # Spring Batch JobParameters 빌더 패턴에서 허용

# 포맷팅은 ktlint가 담당 (detekt-formatting 플러그인 미사용)
