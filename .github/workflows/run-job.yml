name: Run batch job (manual)
run-name: run ${{ github.event.inputs.jobName }} on (${{ github.event.inputs.profile }}) by @${{ github.actor }}

# 임의의 배치 잡을 수동 실행한다. profile과 같은 라벨의 self-hosted runner(=해당 환경 서버) 위에서 run-job.sh를 직접 실행한다.
# 새 잡이 추가돼도 jobName / parameters 만 바꿔 그대로 재사용한다.
# 주의: parameters는 서버 셸에 그대로 전달되므로, 저장소 write 권한자(메인테이너)만 실행하도록 관리한다.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "실행할 환경 (dev / prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"
      jobName:
        description: "실행할 잡 이름 (예: memberPurgeJob)"
        required: true
        type: string
      parameters:
        description: "잡 파라미터 (예: baseDate=2026-07-15 from=2026-06-01T00:00:00 to=2026-06-05T00:00:00)"
        required: false
        default: ""

jobs:
  run:
    runs-on:
      - self-hosted
      - ${{ github.event.inputs.profile }}
    environment: ${{ github.event.inputs.profile }}
    steps:
      - name: Run job
        run: /opt/azit-batch/run-job.sh "${{ github.event.inputs.jobName }}" ${{ github.event.inputs.parameters }}
