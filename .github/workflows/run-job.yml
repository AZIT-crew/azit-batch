name: Run batch job (manual)
run-name: run ${{ github.event.inputs.jobName }} on (${{ github.event.inputs.profile }}) by @${{ github.actor }}

# 임의의 배치 잡을 수동 실행한다 (SSH -> 서버의 run-job.sh). 대상 서버는 profile(환경)로 결정된다.
# 새 잡이 추가돼도 jobName / parameters 만 바꿔 그대로 재사용한다.
# 주의: parameters는 서버 셸에 그대로 전달되므로, 저장소 write 권한자(메인테이너)만 실행하도록 관리한다.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "실행할 환경 (dev / prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"
      jobName:
        description: "실행할 잡 이름 (예: memberPurgeJob)"
        required: true
        type: string
      parameters:
        description: "잡 파라미터 (예: baseDate=2026-07-15 from=2026-06-01T00:00:00 to=2026-06-05T00:00:00). memberPurgeJob은 baseDate 필수"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.profile }}
    steps:
      - name: Run job on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GABIA_HOST }}
          username: ${{ secrets.GABIA_USER }}
          key: ${{ secrets.GABIA_SSH_KEY }}
          port: ${{ secrets.GABIA_PORT }}
          script: |
            /opt/azit-batch/run-job.sh "${{ github.event.inputs.jobName }}" ${{ github.event.inputs.parameters }}
