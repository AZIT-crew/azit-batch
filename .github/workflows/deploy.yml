name: azit-batch CD (Deploy)
run-name: azit-batch deployed to (${{ github.event.inputs.profile }}) by @${{ github.actor }}

# self-hosted runner를 각 서버(dev/prod)에 등록해두고, deploy 잡이 그 서버 위에서 직접 돈다.
# SSH/scp 없이 로컬 파일 쓰기 + docker pull 만으로 배포가 끝난다 (방화벽/러너 IP 이슈 없음).
# 이미지 push + 서버에 .env/스크립트/이미지 준비까지만 하고, 실제 실행은 서버 cron / 수동 워크플로우가 담당한다.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "적용할 프로파일 선택"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"
      version:
        description: "배포 버전 입력 (예: v1.0.0, 비우면 latest)"
        required: true
        type: string
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.event.inputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.sha }}

  deploy:
    needs: build-and-push
    # profile과 같은 이름의 라벨을 가진 self-hosted runner(=해당 환경 서버)로 라우팅된다.
    # 사전 준비: 각 서버에 self-hosted runner를 등록하며 --labels dev(또는 prod) 를 지정해야 한다.
    runs-on:
      - self-hosted
      - ${{ github.event.inputs.profile }}
    environment: ${{ github.event.inputs.profile }}
    env:
      APP_DIR: /opt/azit-batch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: |
          mkdir -p ${{ env.APP_DIR }}
          cat <<EOF > ${{ env.APP_DIR }}/.env
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG=${{ github.event.inputs.version }}
          TARGET_PROFILE=${{ github.event.inputs.profile }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}
          KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}
          APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          APPLE_SERVICE_ID=${{ secrets.APPLE_SERVICE_ID }}
          APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
          APPLE_KEY_PATH=${{ secrets.APPLE_KEY_PATH }}
          DISCORD_BATCH_WEBHOOK=${{ secrets.DISCORD_BATCH_WEBHOOK }}
          NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }}
          EOF
          chmod 600 ${{ env.APP_DIR }}/.env

      - name: Install run-job.sh
        run: |
          cp deploy/run-job.sh ${{ env.APP_DIR }}/run-job.sh
          chmod +x ${{ env.APP_DIR }}/run-job.sh

      - name: Pull image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.event.inputs.version }}
          docker image prune -f
          echo "배포 완료: ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.event.inputs.version }} (profile=${{ github.event.inputs.profile }})"

  notify:
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          noprefix: true
          status: ${{ needs.build-and-push.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure' }}
          title: "🚀 azit-batch 배포 결과"
          description: |
            **배포 환경:** `${{ github.event.inputs.profile }}`
            **버전:** `${{ github.event.inputs.version }}`
            **결과:** ${{ (needs.build-and-push.result == 'success' && needs.deploy.result == 'success') && '✅ 성공' || '❌ 실패' }}
            **로그:** [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ (needs.build-and-push.result == 'success' && needs.deploy.result == 'success') && '0x00ff00' || '0xff0000' }}
