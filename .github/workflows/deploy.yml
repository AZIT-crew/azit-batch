name: azit-batch CD (Deploy)
run-name: azit-batch deployed to (${{ github.event.inputs.profile }}) by @${{ github.actor }}

# 배치는 상시 구동이 아니므로 여기서 컨테이너를 "실행"하지 않음
# 이미지 push + 서버에 .env/스크립트/이미지 준비까지만 하고, 실제 실행은 서버 cron / 수동 워크플로우가 담당
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "적용할 프로파일 선택"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"
      version:
        description: "배포 버전 입력 (예: v1.0.0, 비우면 latest)"
        required: true
        type: string
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.event.inputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.profile }}
    env:
      APP_DIR: /opt/azit-batch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy run script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GABIA_HOST }}
          username: ${{ secrets.GABIA_USER }}
          key: ${{ secrets.GABIA_SSH_KEY }}
          port: ${{ secrets.GABIA_PORT }}
          source: "deploy/run-job.sh"
          target: ${{ env.APP_DIR }}
          strip_components: 1 # deploy/ 폴더를 떼고 파일만 전송

      - name: Write .env, pull image on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GABIA_HOST }}
          username: ${{ secrets.GABIA_USER }}
          key: ${{ secrets.GABIA_SSH_KEY }}
          port: ${{ secrets.GABIA_PORT }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            cat <<EOF > .env
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            IMAGE_TAG=${{ github.event.inputs.version }}
            TARGET_PROFILE=${{ github.event.inputs.profile }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}
            AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}
            KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_SERVICE_ID=${{ secrets.APPLE_SERVICE_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_KEY_PATH=${{ secrets.APPLE_KEY_PATH }}
            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
            NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }}
            EOF
            chmod 600 .env
            chmod +x run-job.sh
            docker pull ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.event.inputs.version }}
            docker image prune -f
            echo "배포 완료: ${{ secrets.DOCKER_USERNAME }}/azit-batch:${{ github.event.inputs.version }} (profile=${{ github.event.inputs.profile }})"

  notify:
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          noprefix: true
          status: ${{ needs.build-and-push.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure' }}
          title: "🚀 AZIT 배치 배포 결과"
          description: |
            **배포 환경:** `${{ github.event.inputs.profile }}`
            **버전:** `${{ github.event.inputs.version }}`
            **결과:** ${{ (needs.build-and-push.result == 'success' && needs.deploy.result == 'success') && '✅ 성공' || '❌ 실패' }}
            **로그:** [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ (needs.build-and-push.result == 'success' && needs.deploy.result == 'success') && '0x00ff00' || '0xff0000' }}
